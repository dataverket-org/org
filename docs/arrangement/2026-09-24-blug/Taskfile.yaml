# Bygger foredrag.md
#
# mermaid-cli (mmdc) rendrer Mermaid-blokkene i foredrag.md til
# content/foredrag-N.svg og skriver byggekopien content/foredrag.md med
# blokkene byttet mot bildene. Marp bygger content/foredrag.html og
# content/foredrag.pdf fra kopien.
#
# Krever: task install (brew), og Brave eller Chrome.
#
#   task install    installer go-task, marp-cli og mermaid-cli med Homebrew
#   task            bygg content/foredrag.html og content/foredrag.pdf
#   task --watch    bygg på nytt hver gang foredrag.md endres
#   task dev        live reload: åpne content/live.html i nettleseren, den oppdaterer seg selv ved lagring (ingen pdf)
version: '3'

vars:
  # Nettleseren mmdc og Marp rendrer med: BROWSER_BIN i miljøet vinner, ellers Brave, så Chrome.
  BROWSER_BIN:
    sh: |
      for b in "$BROWSER_BIN" \
        {{if eq OS "darwin"}}"/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"{{else}}/opt/brave.com/brave/brave /usr/bin/brave-browser /usr/bin/google-chrome /usr/bin/chromium{{end}}; do
        [ -n "$b" ] && [ -x "$b" ] && { echo "$b"; exit 0; }
      done
      echo 'fant verken Brave eller Chrome, sett BROWSER_BIN' >&2; exit 1

tasks:
  default:
    desc: Bygg content/foredrag.html og content/foredrag.pdf
    sources: [foredrag.md]
    generates: [content/foredrag.html, content/foredrag.pdf]
    cmds:
      - task: copy
      - marp --no-stdin --html content/foredrag.md -o content/foredrag.html
      - marp --no-stdin --html --allow-local-files --browser-path "{{.BROWSER_BIN}}" content/foredrag.md -o content/foredrag.pdf

  install:
    desc: Installer byggeverktøyene med Homebrew
    preconditions:
      - sh: command -v brew
        msg: fant ikke brew, se https://brew.sh
    status:
      - command -v task
      - command -v marp
      - command -v mmdc
    cmds:
      - brew install go-task marp-cli mermaid-cli

  copy:
    desc: Render diagrammene og skriv byggekopien content/foredrag.md
    sources: [foredrag.md]
    generates: [content/foredrag.md]
    env:
      PUPPETEER_EXECUTABLE_PATH: '{{.BROWSER_BIN}}'
    cmds:
      # mermaid.json setter handDrawnSeed. Uten den jitrer rough.js nodeformene litt for
      # hver kjøring, og SVG-ene blir endret i git selv om diagrammet er likt.
      - mmdc -q -c mermaid.json -i foredrag.md -o content/foredrag.md -a content -e svg
      # Kopien og alt den peker på ligger i content/, så mappa strykes fra bildestiene i manuset.
      # Mønsteret krever ![...] foran, ellers strykes content/ også fra vanlige lenker, og da
      # bakte Marp inn file:///Users/... i pdf-en. g-en tar med bilde nummer to på samme linje.
      - sed 's#!\(\[[^]]*\]\)(content/#!\1(#g' content/foredrag.md > content/foredrag.tmp && mv content/foredrag.tmp content/foredrag.md

  dev:
    desc: Hold kopien oppdatert og la Marp rendre content/live.html med live reload i nettleseren
    cmds:
      # Marp gir opp med en gang hvis byggekopien mangler, så den bygges ferdig før vaktene starter.
      - task: copy
      - task: dev:watch

  dev:watch:
    internal: true
    deps: [dev:copy, dev:marp]

  dev:copy:
    internal: true
    cmds:
      - task --watch copy

  dev:marp:
    internal: true
    cmds:
      - marp -w --html content/foredrag.md -o content/live.html
