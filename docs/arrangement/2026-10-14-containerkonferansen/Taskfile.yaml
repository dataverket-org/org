# Builds foredrag.md with mermaid-cli and Marp.
#
#   foredrag.md            source
#   content/foredrag-N.svg rendered Mermaid blocks, committed
#   content/foredrag.md    build copy, blocks replaced by the images, not committed
#   content/foredrag.html  committed
#   content/foredrag.pdf   committed
#
# Requires go-task, marp-cli, mermaid-cli (`task install`) and one of Brave,
# Chrome, Chromium, Firefox.
#
#   task                 list the targets
#   task build           build html and pdf
#   task --watch build   rebuild on every change to foredrag.md
#   task dev             live reload in content/live.html, no pdf
version: '3'

vars:
  # BROWSER_BIN in the env wins. macOS: Spotlight by bundle id, app bundles are
  # not in PATH. Linux: command -v.
  BROWSER_BIN:
    sh: |
      [ -n "$BROWSER_BIN" ] && [ -x "$BROWSER_BIN" ] && { echo "$BROWSER_BIN"; exit 0; }
      {{if eq OS "darwin"}}
      for id in "com.brave.Browser:Brave Browser" "com.google.Chrome:Google Chrome" "org.chromium.Chromium:Chromium" "org.mozilla.firefox:firefox"; do
        app=$(mdfind "kMDItemCFBundleIdentifier == '${id%%:*}'" | head -n 1)
        b="$app/Contents/MacOS/${id#*:}"
        [ -n "$app" ] && [ -x "$b" ] && { echo "$b"; exit 0; }
      done
      {{else}}
      for c in brave-browser brave google-chrome google-chrome-stable chromium chromium-browser firefox firefox-esr; do
        b=$(command -v "$c") && { echo "$b"; exit 0; }
      done
      {{end}}
      echo 'no Brave, Chrome, Chromium or Firefox found, set BROWSER_BIN' >&2; exit 1

  # Marp `--browser` and Puppeteer PUPPETEER_BROWSER: chrome (CDP) or firefox (WebDriver BiDi).
  BROWSER_KIND:
    sh: case "{{.BROWSER_BIN}}" in *irefox*) echo firefox ;; *) echo chrome ;; esac

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Build content/foredrag.html and content/foredrag.pdf
    sources: [foredrag.md]
    generates: [content/foredrag.html, content/foredrag.pdf]
    cmds:
      - task: copy
      - marp --no-stdin --html content/foredrag.md -o content/foredrag.html
      - marp --no-stdin --html --allow-local-files --browser {{.BROWSER_KIND}} --browser-path "{{.BROWSER_BIN}}" content/foredrag.md -o content/foredrag.pdf

  install:
    desc: Install go-task, marp-cli and mermaid-cli with Homebrew
    preconditions:
      - sh: command -v brew
        msg: brew not found, see https://brew.sh
    status:
      - command -v task
      - command -v marp
      - command -v mmdc
    cmds:
      - brew install go-task marp-cli mermaid-cli

  copy:
    desc: Render the diagrams and write the build copy content/foredrag.md
    sources: [foredrag.md]
    generates: [content/foredrag.md]
    env:
      PUPPETEER_BROWSER: '{{.BROWSER_KIND}}'
      PUPPETEER_EXECUTABLE_PATH: '{{.BROWSER_BIN}}'
    cmds:
      # Every Mermaid block sets handDrawnSeed in its %%{init: ...}%% directive; rough.js
      # output is otherwise not stable between runs.
      - mmdc -q -i foredrag.md -o content/foredrag.md -a content -e svg
      # Strip content/ from image paths only. The build copy lives in content/; an
      # unprefixed path in a plain link makes Marp embed file:///... in the pdf.
      - sed 's#!\(\[[^]]*\]\)(content/#!\1(#g' content/foredrag.md > content/foredrag.tmp && mv content/foredrag.tmp content/foredrag.md

  dev:
    desc: Keep the build copy current and let Marp render content/live.html with live reload
    cmds:
      # Marp exits if the build copy is missing at start.
      - task: copy
      - task: dev:watch

  dev:watch:
    internal: true
    deps: [dev:copy, dev:marp]

  dev:copy:
    internal: true
    cmds:
      - task --watch copy

  dev:marp:
    internal: true
    cmds:
      - marp -w --html content/foredrag.md -o content/live.html
