# Everything design/ generates.
#
# You need podman (or docker) and go-task. Nothing else: no Node on your
# machine, no Python. The build itself lives in the Dockerfile and runs in
# image layers - nothing is bind-mounted, so there is no :z for SELinux, no
# --user to stop output being root-owned, and no mount semantics to differ
# between macOS, Linux and rootless. `task build` runs the image build and
# copies the results out.
#
#   task            list the targets
#   task build      build the image and copy build/ and vendor/ out of it
#   task preview    serve the built site from the image
#   task check      fail if the committed build/ is out of sync with the sources
#   task clean      remove what `task build` produced
#
# Two directories come out, and the split is the whole filing system:
#
#   build/   what we generate from our own sources - theme.css from
#            designsystemet.config.json, the mark SVGs from logo.mjs.
#            Committed, so a consumer needs no toolchain at all.
#   vendor/  third-party, fetched verbatim. Not committed.
version: '3'

vars:
  # Bump a version, then `task image:rebuild`. DS_VERSION also names the image
  # tag, so bumping that one rebuilds on its own.
  DS_VERSION: '1.23.0'
  ESBUILD_VERSION: '0.24.0'
  FONTKIT_VERSION: '2.0.4'
  HTTP_SERVER_VERSION: '14.1.1'
  HTMX_VERSION: '2.0.4'
  FONTSOURCE_VERSION: '5.3.0'

  IMAGE: 'dataverket-design:{{.DS_VERSION}}'

  # podman first, docker if podman is missing. CONTAINER_BIN in the env wins.
  CONTAINER_BIN:
    sh: |
      for c in "$CONTAINER_BIN" podman docker; do
        [ -n "$c" ] && command -v "$c" >/dev/null 2>&1 && { echo "$c"; exit 0; }
      done
      echo 'neither podman nor docker found, set CONTAINER_BIN' >&2; exit 1

tasks:
  default:
    # No target given means "what can I run here", not "rebuild everything".
    silent: true
    cmds:
      - task --list

  image:
    desc: Build the toolchain image, which also runs the build
    # Both checks are needed. `sources` alone skips the build when the image
    # has been deleted but the files have not changed; `status` alone never
    # rebuilds after a source edit.
    status:
      - '{{.CONTAINER_BIN}} image exists {{.IMAGE}}'
    sources:
      - Dockerfile
      - fonts.sh
      - designsystemet.config.json
      - logo.mjs
      - dataverket.css
      - preview.html
    cmd: >-
      {{.CONTAINER_BIN}} build -q
      --build-arg DS_VERSION={{.DS_VERSION}}
      --build-arg ESBUILD_VERSION={{.ESBUILD_VERSION}}
      --build-arg FONTKIT_VERSION={{.FONTKIT_VERSION}}
      --build-arg HTTP_SERVER_VERSION={{.HTTP_SERVER_VERSION}}
      --build-arg HTMX_VERSION={{.HTMX_VERSION}}
      --build-arg FONTSOURCE_VERSION={{.FONTSOURCE_VERSION}}
      -t {{.IMAGE}} "{{.TASKFILE_DIR}}"

  image:rebuild:
    desc: Rebuild the image from scratch, ignoring the layer cache
    cmds:
      - '{{.CONTAINER_BIN}} build --no-cache -q -t {{.IMAGE}} "{{.TASKFILE_DIR}}"'

  image:rm:
    desc: Delete the image
    cmd: '{{.CONTAINER_BIN}} rmi -f {{.IMAGE}} || true'

  build:
    desc: Build the image and copy build/ and vendor/ out of it
    deps: [image]
    cmds:
      - task: copy-out
        vars: {SRC: build, DEST: build}
      - task: copy-out
        vars: {SRC: vendor, DEST: vendor}

  copy-out:
    internal: true
    # `podman cp` needs a container, not an image, so one is created and thrown
    # away without ever running. It is also the only extraction that works
    # everywhere: `build --output type=local` is unsupported in podman's remote
    # mode, which is what macOS uses.
    cmds:
      - rm -rf "{{.TASKFILE_DIR}}/{{.DEST}}"
      - |
        cid=$({{.CONTAINER_BIN}} create {{.IMAGE}} true)
        {{.CONTAINER_BIN}} cp "$cid:/site/{{.SRC}}" "{{.TASKFILE_DIR}}/{{.DEST}}"
        {{.CONTAINER_BIN}} rm "$cid" >/dev/null

  preview:
    desc: Serve the built site from the image
    # Fails fast rather than quietly building for half a minute.
    preconditions:
      - sh: '{{.CONTAINER_BIN}} image exists {{.IMAGE}}'
        msg: no image yet - run `task build` first
    cmds:
      - '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} http://localhost:8123/preview.html &'
      - '{{.CONTAINER_BIN}} run --rm -p 8123:8123 {{.IMAGE}}'

  check:
    desc: Fail if the committed build/ is out of sync with the sources
    # Rebuilds from the sources and diffs against what is committed. It does
    # not trust the layer cache for this: --no-cache on the generate stages
    # would be slow, so the image task's `sources` fingerprint is relied on to
    # rebuild when anything it reads has changed.
    deps: [image]
    cmds:
      - task: copy-out
        vars: {SRC: build, DEST: .check}
      - cmd: diff -r "{{.TASKFILE_DIR}}/.check" "{{.TASKFILE_DIR}}/build"
        msg: build/ is out of sync with the sources, run `task build` and commit the result
      - rm -rf "{{.TASKFILE_DIR}}/.check"

  clean:
    desc: Remove what `task build` produced
    # vendor/ is fetched and gitignored; build/ is committed, so it survives.
    # `task clean:all` drops that too, and the image goes with `task image:rm`.
    cmds:
      - rm -rf vendor .task .check

  clean:all:
    desc: Clean, and drop the committed build/ as well (back to sources only)
    cmds:
      - task: clean
      - rm -rf build
