# Requires podman (or docker) and go-task.
#
#   build/   generated from our sources, committed
#   vendor/  third-party, fetched, not committed
version: '3'

vars:
  # Bump, then `task image:rebuild`. DS_VERSION names the image tag.
  DS_VERSION: '1.23.0'
  ESBUILD_VERSION: '0.24.0'
  FONTKIT_VERSION: '2.0.4'
  HTTP_SERVER_VERSION: '14.1.1'
  HTMX_VERSION: '2.0.4'
  FONTSOURCE_VERSION: '5.3.0'

  IMAGE: 'dataverket-design:{{.DS_VERSION}}'

  # CONTAINER_BIN in the env wins.
  CONTAINER_BIN:
    sh: |
      for c in "$CONTAINER_BIN" podman docker; do
        [ -n "$c" ] && command -v "$c" >/dev/null 2>&1 && { echo "$c"; exit 0; }
      done
      echo 'neither podman nor docker found, set CONTAINER_BIN' >&2; exit 1

tasks:
  default:
    silent: true
    cmds:
      - task --list

  image:
    desc: Build the toolchain image, which also runs the build
    # status covers a deleted image, sources covers an edited file.
    status:
      - '{{.CONTAINER_BIN}} image exists {{.IMAGE}}'
    sources:
      - Dockerfile
      - fonts.sh
      - designsystemet.config.json
      - logo.js
      - dataverket.css
      - preview.html
    cmd: >-
      {{.CONTAINER_BIN}} build -q
      --build-arg DS_VERSION={{.DS_VERSION}}
      --build-arg ESBUILD_VERSION={{.ESBUILD_VERSION}}
      --build-arg FONTKIT_VERSION={{.FONTKIT_VERSION}}
      --build-arg HTTP_SERVER_VERSION={{.HTTP_SERVER_VERSION}}
      --build-arg HTMX_VERSION={{.HTMX_VERSION}}
      --build-arg FONTSOURCE_VERSION={{.FONTSOURCE_VERSION}}
      -t {{.IMAGE}} "{{.TASKFILE_DIR}}"

  image:rebuild:
    desc: Rebuild the image from scratch, ignoring the layer cache
    cmds:
      - '{{.CONTAINER_BIN}} build --no-cache -q -t {{.IMAGE}} "{{.TASKFILE_DIR}}"'

  image:rm:
    desc: Delete the image
    cmd: '{{.CONTAINER_BIN}} rmi -f {{.IMAGE}} || true'

  build:
    desc: Build the image and copy build/ and vendor/ out of it
    deps: [image]
    cmds:
      - task: copy-out
        vars: {SRC: build, DEST: build}
      - task: copy-out
        vars: {SRC: vendor, DEST: vendor}

  copy-out:
    internal: true
    # create + cp + rm, not `build --output`: that is unsupported in podman
    # remote mode, which is what macOS uses.
    cmds:
      - rm -rf "{{.TASKFILE_DIR}}/{{.DEST}}"
      - |
        cid=$({{.CONTAINER_BIN}} create {{.IMAGE}} true)
        {{.CONTAINER_BIN}} cp "$cid:/site/{{.SRC}}" "{{.TASKFILE_DIR}}/{{.DEST}}"
        {{.CONTAINER_BIN}} rm "$cid" >/dev/null

  preview:
    desc: Serve the site from the image, with the working copy mounted
    # deps, not preconditions: deps run first, so a precondition never fires.
    # Read-only mount over /site; the host layout matches it.
    # The image as built:  podman run --rm -p 8123:8123 <IMAGE>
    deps: [build]
    cmds:
      - '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} http://localhost:8123/preview.html &'
      - >-
        {{.CONTAINER_BIN}} run --rm -p 8123:8123
        -v "{{.TASKFILE_DIR}}:/site:ro"
        {{.IMAGE}}

  check:
    desc: Fail if the committed build/ is out of sync with the sources
    # Scratch goes under .task/, not build/: `diff -r` would recurse into it.
    # TASK_TEMP_DIR moves go-task's cache but not this copy.
    deps: [image]
    cmds:
      - task: copy-out
        vars: {SRC: build, DEST: .task/check}
      - cmd: diff -r "{{.TASKFILE_DIR}}/.task/check" "{{.TASKFILE_DIR}}/build"
        msg: build/ is out of sync with the sources, run `task build` and commit the result
      - rm -rf "{{.TASKFILE_DIR}}/.task/check"

  clean:
    desc: Remove what `task build` produced
    cmds:
      - rm -rf vendor .task

  clean:all:
    desc: Clean, and drop the committed build/ as well (back to sources only)
    cmds:
      - task: clean
      - rm -rf build
